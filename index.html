<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gboy - Stream Movies & Anime</title>
    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-surface: #1a1a24;
            --accent: #0052ff;
            --text-main: #ffffff;
            --text-muted: #8a8a9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            border-bottom: 2px solid #232330;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-btn.active, .nav-btn:hover {
            color: var(--text-main);
            border-bottom-color: var(--accent);
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
        }

        .search-box input {
            background-color: #232330;
            border: 1px solid #323245;
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 4px;
            outline: none;
            width: 220px;
        }

        .search-box button {
            background-color: var(--accent);
            color: var(--text-main);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        #player-section {
            margin-bottom: 2.5rem;
            background-color: var(--bg-surface);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #232330;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
            border-radius: 6px;
            overflow: hidden;
        }

        #video-stream-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .player-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .close-player {
            background: #cc0000;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .episode-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .episode-container select {
            background-color: #232330;
            color: white;
            border: 1px solid #323245;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .card {
            background-color: var(--bg-surface);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #232330;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            background-color: #232330;
        }

        .card-info {
            padding: 0.8rem;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.3rem;
        }

        .card-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid #232330;
            background-color: var(--bg-surface);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Gboy</div>
        <nav>
            <button class="nav-btn active" id="btn-movies" onclick="switchTab('movie')">Movies</button>
            <button class="nav-btn" id="btn-anime" onclick="switchTab('anime')">Anime</button>
        </nav>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search titles...">
            <button id="search-btn" onclick="executeSearch()">Search</button>
        </div>
    </header>

    <main>
        <section id="player-section" class="hidden">
            <div class="player-wrapper">
                <iframe id="video-stream-player" src="" allowfullscreen frameborder="0"></iframe>
            </div>
            <div class="player-controls">
                <div>
                    <h2 id="now-playing-title">Now Playing</h2>
                    <div id="anime-episode-selector" class="episode-container hidden" style="margin-top: 0.5rem;">
                        <label for="ep-select">Switch Episode: </label>
                        <select id="ep-select" onchange="changeAnimeEpisode(this.value)"></select>
                    </div>
                </div>
                <button class="close-player" onclick="closePlayer()">✕ Close Player</button>
            </div>
        </section>

        <section id="catalog-section">
            <h2 id="section-heading">Trending Movies</h2>
            <div id="media-grid" class="grid"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Gboy. Built with high-speed direct media servers.</p>
    </footer>

    <script>
        let currentTab = 'movie'; 
        let activeAnimeEpisodes = [];
        let activeAnimeTitle = "";

        const MOVIE_API = "https://themoviedb.org";
        // Fixed and Active TMDB Key
        const TMDB_PUBLIC_KEY = "8baba8ab6b8bbe247645bcae7df63d0d"; 
        const ANIME_API = "https://consumet.org";

        document.addEventListener("DOMContentLoaded", () => {
            loadTrendingContent();
            
            document.getElementById('search-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') executeSearch();
            });
        });

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('search-input').value = "";
            closePlayer();
            
            if(tab === 'movie') {
                document.getElementById('btn-movies').classList.add('active');
                document.getElementById('section-heading').innerText = "Trending Movies";
            } else {
                document.getElementById('btn-anime').classList.add('active');
                document.getElementById('section-heading').innerText = "Popular Anime";
            }
            loadTrendingContent();
        }

        async function loadTrendingContent() {
            const grid = document.getElementById('media-grid');
            grid.innerHTML = "<p>Loading feed selection...</p>";
            
            try {
                if (currentTab === 'movie') {
                    const res = await fetch(`${MOVIE_API}/trending/movie/week?api_key=${TMDB_PUBLIC_KEY}`);
                    const data = await res.json();
                    renderMovies(data.results);
                } else {
                    const res = await fetch(`${ANIME_API}/top-airing`);
                    const data = await res.json();
                    renderAnime(data.results);
                }
            } catch (err) {
                grid.innerHTML = "<p>Failed to parse API feed stream content.</p>";
            }
        }

        function renderMovies(movies) {
            const grid = document.getElementById('media-grid');
            grid.innerHTML = "";
            if(!movies || movies.length === 0) {
                grid.innerHTML = "<p>No movies found matching criteria.</p>";
                return;
            }
            movies.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => launchMoviePlayer(item.id, item.title);
